[package]
name = "youload"
version = "1.0.0"
description = "YouTube downloader with built-in DPI bypass"
authors = ["YouLoad contributors"]
license = "MIT"
repository = "https://github.com/Liidioteee/YouLoad"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "youload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = "0.11.1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
anyhow = "1.0.104"
uuid = { version = "1.29.0", features = ["v4"] }
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time", "net"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "http2"] }
url = "2.5.8"
sha2 = "0.11.1"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
sys-locale = "0.3.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Registry", "Win32_Security_Authorization"] }
